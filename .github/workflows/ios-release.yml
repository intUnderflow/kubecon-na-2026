# Builds the iOS app and attaches it to a GitHub release as kubecon-na-2026.ipa, next to the
# Android APK.
#
# The .ipa is unsigned: Apple only lets App Store / TestFlight builds install directly, so people
# install it with a sideloading tool that signs it with their own Apple ID (see the README).
#
# - Publishing a release builds that release's tag and attaches the .ipa to it.
# - Run it by hand (Actions > iOS release > Run workflow) to attach a build of the chosen branch to
#   an existing release: the tag you enter, or the latest release when left empty.
name: iOS release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the app to (empty: the latest release)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  ipa:
    name: Build and attach kubecon-na-2026.ipa
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pick the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "Attaching to release $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Core tests (ios/Core)
        working-directory: ios/Core
        run: swift test

      - name: Archive (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/KCNA26.xcodeproj -scheme KCNA26 -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/KCNA26.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive

      - name: Package the .ipa
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/KCNA26.xcarchive/Products/Applications/KCNA26.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../kubecon-na-2026.ipa Payload)
          shasum -a 256 build/kubecon-na-2026.ipa | tee build/kubecon-na-2026.ipa.sha256
          {
            echo "### kubecon-na-2026.ipa"
            echo
            echo "Release: \`${{ steps.release.outputs.tag }}\`, built from \`$(git rev-parse --short HEAD)\`"
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 build/kubecon-na-2026.ipa.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" build/kubecon-na-2026.ipa \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Mention the iOS app in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Adds a short iOS note once (marked, so re-runs don't repeat it); the rest is left as written.
          notes=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          case "$notes" in *"<!-- ios-ipa -->"*) echo "Release notes already mention the iOS app"; exit 0;; esac
          sha=$(cut -d' ' -f1 build/kubecon-na-2026.ipa.sha256)
          {
            printf '%s\n\n' "$notes"
            echo "<!-- ios-ipa -->"
            echo "**iPhone and iPad (iOS 17 or later):** download \`kubecon-na-2026.ipa\` below and install it with a sideloading tool such as AltStore or Sideloadly, which signs it with your own Apple ID. See the README for the steps."
            echo
            echo "iOS SHA-256: \`$sha\`"
          } > build/notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file build/notes.md
